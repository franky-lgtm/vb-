

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 双手手势交互</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 渲染画布：全屏底层，后续 B2 合成管线在此绘制 -->
  <canvas id="stage"></canvas>

  <!-- UI 覆盖层：pointer-events 默认穿透，需要交互的元素单独开启 -->
  <div id="ui" class="ui" data-state="idle">

    <!-- 顶部：标题 + 状态 -->
    <header class="ui-top">
      <div class="ui-status">
        <span id="state-dot" class="state-dot" data-state="idle"></span>
        <span id="state-text">空闲</span>
      </div>
    </header>

    <!-- 状态 / 错误提示条 -->
    <div id="notice" class="ui-notice" hidden></div>

    <!-- 单手提示 -->
    <div id="hand-hint" class="ui-hand-hint" hidden>⚠ 只识别到一只手</div>

    <!-- 底部控制栏 -->
    <footer class="ui-bottom">
      <div class="ui-controls">
        <button id="btn-camera" class="btn">📷 启动摄像头</button>
        <button id="btn-demo"   class="btn btn-primary">🎭 演示模式</button>
        <button id="btn-filter" class="btn">🎨 滤镜：开</button>
        <button id="btn-reset"  class="btn">↺ 重置</button>
      </div>
      <div class="ui-smooth">
        <label for="smooth">平滑度 <span id="smooth-val">0.6</span></label>
        <input type="range" id="smooth" min="0" max="1" step="0.05" value="0.6">
      </div>
    </footer>
  </div>

  <!--
    脚本顺序约定（开发期拆多文件，交付前合并为 app.js）：
      1. src/tracking.js —— A 的管线（ES module，末尾挂 window.AR / window.LM）
      2. main.js         —— B 的 UI 接线骨架
      3. filters.js      —— B 的渲染 / 三面片 / 滤镜（B2/B3）

    tracking.js 是 module，且首次需从 CDN 下载 MediaPipe（约 10 秒），
    期间它尚未执行、window.AR 未挂载。为让页面立即响应：
      - 下方内联脚本先显示“加载中”提示；
      - main.js / filters.js 改为普通脚本（先执行），内部轮询等待 window.AR 就绪。
  -->
  <script>
    (function () {
      var n = document.getElementById("notice");
      if (n) { n.hidden = false; n.textContent = "正在加载 AR 管线…（首次需联网，约 10 秒，请稍候）"; }
    })();
  </script>
  <script type="module" src="./src/tracking.js"></script>
  <script src="./main.js"></script>
  <script src="./filters.js"></script>
</body>
</html>
